name: Build CloudPhotoPan APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CloudPhotoPan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhotoPan-APK
          path: CloudPhotoPan.apk

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "云相册网盘 APK v1.0.${{ github.run_number }}"
          body: "自动构建的专属云相册与全能网盘合一 APK（内置相册瀑布流预览、相机后台自动备份直传 Cloudflare R2 -> Google Drive、完整 AList 网盘双视图）"
          files: CloudPhotoPan.apk
          prerelease: false
