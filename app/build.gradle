plugins {
    id 'com.android.application'
}

android {
    namespace 'top.czyxh.pan'
    compileSdk 34

    defaultConfig {
        applicationId "top.czyxh.pan"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    signingConfigs {
        release {
            storeFile file("release-key.p12")
            storePassword "cloudpan123456"
            keyAlias "cloudpan"
            keyPassword "cloudpan123456"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
